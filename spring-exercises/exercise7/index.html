<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ArtSpot</title>

  <link rel="icon" type="image/png" href="image/favicon.png" />

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;700&family=Roboto:wght@400&display=swap" rel="stylesheet"/>
</head>
<body>

  <div class="splash-container">

    <!-- left column -->
    <div class="splash-left">
      <img src="image/artspot.png" alt="ArtSpot Logo" class="logo" />
      <h1 class="headline">Showcase Your Creativity</h1>
      <p class="subheadline">
        Join a large community of artists, designers, and photographers. 
        Share your work, get inspired, and connect with creative minds from around the world.
      </p>
    </div>

    <!-- right column -->
    <div class="splash-right">
      <div class="login-box">
        <h2 class="welcome-text">Welcome</h2>

        <div class="form-group">
          <label for="email">Username:</label>
          <input type="email" id="email" placeholder="your.username" />
        </div>

        <div class="form-group" style="margin-top: 15px;">
          <label for="password">Password:</label>
          <input type="password" id="password" placeholder="*******" />
        </div>

        <p class="signup-link"><a href="#">Not a Member? Sign up</a></p>

        <button class="login-btn" id="loginBtn" disabled>Log In</button>
      </div>
    </div>

  </div>

  <!-- the js to enable button only when fields are filled but i disabled the button for exercise purposes-->
  <script>
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const loginBtn = document.getElementById("loginBtn");

    function checkFields() {
      const emailFilled = emailInput.value.trim() !== "";
      const passwordFilled = passwordInput.value.trim() !== "";

      loginBtn.disabled = !(emailFilled && passwordFilled);
    }

    emailInput.addEventListener("input", checkFields);
    passwordInput.addEventListener("input", checkFields);

    loginBtn.addEventListener("click", () => {
});
  </script>

</body>
</html>
