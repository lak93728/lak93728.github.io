<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brews & Bonds</title>
  <link rel="icon" href="images/favicon.ico" type="image/x-icon" />
  <link href="https://fonts.googleapis.com/css2?family=Poor+Story&family=Pontano+Sans&family=Tenor+Sans&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page-wrapper">
    <header>
      <div class="branding-area">
        <a href="index.html" class="logo-link">
          <img src="images/coffeelogo.png" alt="Brews & Bonds logo" class="logo" />
        </a>
        <a href="index.html" class="site-title">Brews & Bonds</a>
      </div>
      <nav class="nav-area" id="nav-area">
        <ul>
          <li><a href="#menu">Menu</a></li>
          <li><a href="#events">Events</a></li>
          <li><a href="#about">About</a></li>
        </ul>
      </nav>
    </header>

    <div class="hero-image">
      <div class="image-crop">
        <img src="images/coffeeshop.JPG" alt="Coffee shop" />
        <div class="overlay-box">
          <p class="overlay-text">Come for the coffee,<br />stay for the moments.</p>
        </div>
      </div>
    </div>

    <p class="section-title">Customer Favorites</p>

    <div class="image-row">
      <div class="image-block">
        <img src="images/icedcoffee.jpg" alt="Iced Coffee" />
        <p class="image-caption">Iced Coffee - $4.00</p>
      </div>
      <div class="image-block">
        <img src="images/matcha.jpg" alt="Matcha Latte" />
        <p class="image-caption">Matcha Latte - $4.50</p>
      </div>
      <div class="image-block">
        <img src="images/croissant.jpg" alt="Croissant" />
        <p class="image-caption">Croissant - $2.50</p>
      </div>
    </div>
  </div>
</body>
</html>
