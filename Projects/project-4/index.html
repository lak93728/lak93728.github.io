<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Aurora Art Museum</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&display=swap" rel="stylesheet">

  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap" rel="stylesheet">
  
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar container-fluid">
    <div class="row align-items-end">
    <div class="row">
      <!-- Logo placeholder -->
      <div class="logo-nav">
        <div class="logo">
        <img src="images/logo.png" alt="Aurora Art Museum Logo">
      </div>
      </div>
      
      <!-- Nav links side by side -->
      <div class="col nav-links">
        <a href="#">Visit</a>
        <a href="#">Exhibitions</a>
        <a href="#">Collections</a>
        <a href="#">Events</a>
        <a href="#">About</a>
      </div>
      <!-- Ticket button -->
      <div class="ticket-nav">
        <button class="ticket-button">Get Tickets</button>
      </div>
    </div>
  </header>
<section class="hero">
  <img src="images/hero.jpg" alt="Aurora Art Museum Hero">
</section>

<section class="info-section">
  <div class="intro-block">
    <h2 class="welcome-text">Welcome</h2>
    <p class="tagline">Start your journey through art</p>
  </div>

  <div class="visit-block">
    <p class="hours">Open everyday but Mondays.</p>
    <button class="visit-button">Plan Your Visit</button>
  </div>
</section>
</body>
</html>
