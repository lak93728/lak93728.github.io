<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Page</title>
  <style>
    body {
      margin: 0;
    }

    /* Navigation */
    nav {
      display: flex;
      justify-content: space-between;
      padding: 10px;
    }

    nav a {
      margin-left: 10px;
    }

    /* Layout */
    .container {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 10px;
      padding: 10px;
    }

    /* Media Query */
    @media (max-width: 600px) {
      .container {
        grid-template-columns: 1fr;
      }

      nav {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

  <nav>
    <div>Site Title</div>
    <div>
      <a href="#">Home</a>
      <a href="#">About</a>
    </div>
  </nav>

  <div class="container">
    <div>
      <h1>Heading</h1>
      <p>Some text goes here.</p>
    </div>
    <div>
      <p>Sidebar content.</p>
    </div>
  </div>

</body>
</html>
